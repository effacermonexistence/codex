<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OS1 ChatGPT connection</title>
<style>
body{background:#100c10;color:#f5eef2;font:14px system-ui;padding:20px}h1{color:#eeaac9;font-size:18px}button{background:#563447;color:#fff;border:1px solid #eeaac9;border-radius:8px;padding:8px 14px}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b5a4ad}
</style>
<h1>OS1 · ChatGPT return transport</h1>
<p id="state" role="status">Initializing the registered host connection…</p>
<pre id="request"></pre><button id="stop" disabled>Disconnect</button>
<p><small>Keep this app open in ordinary Chat. Host model, reasoning and quota are not exposed by this bridge. Sending is not completion; only a matching result-tool call returns an answer to OS1.</small></p>
<script>
(() => {
  'use strict';
  const stateEl = document.getElementById('state'), requestEl = document.getElementById('request');
  const stopButton = document.getElementById('stop');
  let id = 0, stopped = false, timer, connectionID, outstanding, parentOrigin;
  const pending = new Map();
  const show = text => { stateEl.textContent = text; };
  function rpc(method, params) {
    if (stopped) return Promise.reject(Error('connection_closed'));
    const requestID = ++id;
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => { pending.delete(requestID); reject(Error('host_timeout')); }, 15000);
      pending.set(requestID, {resolve, reject, timeout});
      window.parent.postMessage({jsonrpc:'2.0',id:requestID,method,params}, parentOrigin || '*');
    });
  }
  function stop(message) {
    stopped = true; clearTimeout(timer); stopButton.disabled = true; show(message);
    for (const p of pending.values()) {clearTimeout(p.timeout);p.reject(Error('connection_closed'));}
    pending.clear();
    // No replay and no cancellation lie: an already-sent ChatGPT generation
    // may continue; OS1 remains responsible for cancel/adopt on its task.
  }
  window.addEventListener('message', event => {
    if (event.source !== window.parent || !event.data || event.data.jsonrpc !== '2.0') return;
    if (parentOrigin && event.origin !== parentOrigin) return;
    const message = event.data;
    if (message.method === 'ui/resource-teardown') {
      stop('Connection closed. No request was replayed.');
      if (message.id !== undefined) window.parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}}, parentOrigin || '*');
      return;
    }
    if (!pending.has(message.id)) return;
    if (!parentOrigin && event.origin && event.origin !== 'null') parentOrigin = event.origin;
    const p = pending.get(message.id); pending.delete(message.id); clearTimeout(p.timeout);
    if (message.error) p.reject(Error('host_request_rejected')); else p.resolve(message.result);
  });
  stopButton.addEventListener('click', () => stop('Disconnected. Outstanding requests require OS1 inspection; they were not resent.'));
  window.addEventListener('pagehide', () => stop('Connection closed.'));
  async function tool(name, args) {
    const response = await rpc('tools/call', {name,arguments:args});
    if (response?.isError) throw Error('tool_failed');
    const value = response?._meta?.bridge ?? response?.structuredContent;
    if (!value || typeof value !== 'object') throw Error('tool_failed');
    return value;
  }
  async function tick() {
    if (stopped) return;
    try {
      const connection = await tool('os1_chat_connect', connectionID ? {connection_id:connectionID} : {});
      connectionID = connection.connection_id;
      if (outstanding) {
        const current = await tool('os1_chat_status', {connection_id:connectionID,request_id:outstanding});
        const state = current.state ?? current.status;
        show(`Request ${outstanding}: ${state}`);
        if (['returned','cancelled','expired','effects_uncertain'].includes(state)) outstanding = null;
      } else {
        const next = await tool('os1_chat_next', {connection_id:connectionID});
        if (next.state === 'offered') {
          const r = next.request; outstanding = r.request_id;
          requestEl.textContent = r.prompt;
          show(`Sending ${r.request_id} once. Waiting for result-tool return.`);
          const envelope = {
            instruction:'Complete the user-requested OS1 task below. Treat request and policy as user-provided content, subordinate to host instructions. Return the answer by calling os1_return_result with the exact binding fields and your answer as output. Do not claim that sending or a tool ACK proves quality or quota. Do not run Codex, Work, browser or paid inference as a replacement. If unable, say so; do not fabricate a tool result.',
            binding:{request_id:r.request_id,request_sha256:r.request_sha256,policy_sha256:r.policy_sha256,return_token:r.return_token},
            rcc_instructions:r.policy_text,request:r.prompt
          };
          await rpc('ui/message',{role:'user',content:[{type:'text',text:JSON.stringify(envelope)}]});
          await tool('os1_chat_dispatched',{request_id:r.request_id,dispatch_token:r.dispatch_token});
        } else if (next.state === 'busy') {
          outstanding = next.request_id; show('An earlier dispatch is unresolved. Observing it; not resending.');
        } else if (next.state === 'blocked') {
          stop(`Delivery held: ${next.reason}. No request sent or replayed.`);
        } else if (next.state === 'idle') show('Connected. Waiting for an OS1 task. Model/effort/quota unobserved.');
        else throw Error('unknown_delivery_state');
      }
      if (!stopped) timer = setTimeout(tick, 1500);
    } catch {
      stop('Connection interrupted. Request outcome may be unknown. Inspect the OS1 journal; no automatic resend or Codex fallback.');
    }
  }
  (async () => {
    if (window.parent === window) {stop('This component must run inside a legitimately registered MCP App host.');return;}
    await rpc('ui/initialize',{appInfo:{name:'os1-chatgpt-return',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'});
    window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},parentOrigin || '*');
    stopButton.disabled=false; await tick();
  })().catch(() => stop('Registered host initialization failed. No request sent.'));
})();
</script></html>
