'use strict';const sources=[{"id":"cr-001","file":"continuous-779ae60147ee0cb1.jpg","sourceSha256":"779ae60147ee0cb108ef65dc2a8fe49b12c3a942efa748c32b12af33e1406973","dimensions":[640,640],"phase":0,"title":"Annotated Portrait","focus":[0.78,0.48]},{"id":"cr-006","file":"continuous-576491770e1de74f.jpg","sourceSha256":"576491770e1de74fb240c4a3a0022411a1ad19b41b492bbce99a9cc9f26ec660","dimensions":[480,640],"phase":2.135,"title":"Floral Scaffold","focus":[0.28,0.7]},{"id":"cr-009","file":"continuous-1d0b8a20821b6e41.jpg","sourceSha256":"1d0b8a20821b6e4129403b36fade54a3c584c4c2dd0a7867211947c6c31c925d","dimensions":[640,628],"phase":3.416,"title":"Interlaced Band","focus":[0.68,0.32]},{"id":"cr-011","file":"continuous-6f8a959ec54ec498.jpg","sourceSha256":"6f8a959ec54ec4985a7cbaf66d2ad8a2bed6e4e484caa380d55e174b64d3d2a9","dimensions":[512,640],"phase":4.27,"title":"Doubled Figure","focus":[0.79,0.65]}],params=new URLSearchParams(location.search),format=params.get('format')||'desktop',mode='cover',v={phase:0};if(!['desktop','mobile'].includes(format))throw Error('Invalid format');const[W,H]=format==='desktop'?[1280,800]:[720,1280],FPS=24,SECONDS=18,canvas=document.getElementById('film');canvas.width=W;canvas.height=H;const gl=canvas.getContext('webgl',{alpha:false,antialias:false,preserveDrawingBuffer:true});if(!gl)throw Error('WebGL unavailable');
